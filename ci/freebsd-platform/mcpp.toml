# The FreeBSD target as this repository's CI builds it: the system's own C
# library and runtimes from the FreeBSD base sysroot (xim:x86_64-freebsd-sysroot,
# FreeBSD 14.5's base.txz), compiled by LLVM. openkal-freebsd is the kernel-abi
# layer above them; the platform names none.
[package]
name    = "openkal-freebsd-ci-platform"
version = "0.1.0"

[platform]
toolchain = "llvm@23.1.3"

[[platform.provider]]
serves  = ["x86_64-freebsd"]
sysroot = "xim:x86_64-freebsd-sysroot@14.5"
hosted  = true

[platform.link]
driver = "compiler"

[platform.layers]
"kernel-abi"       = false
"c-abi"            = false
"c++-abi"          = false
"compiler-runtime" = false
